name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  overlay:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
            skip: false
            skip_reason: ""
            build_bezel_pin: false
          - system: aarch64-linux
            os: ubuntu-latest
            skip: true
            skip_reason: "No aarch64-linux GitHub-hosted runner in this workflow. Pin exists (omp-linux-arm64). Not a pretend green build."
            build_bezel_pin: false
          - system: aarch64-darwin
            os: ubuntu-latest
            skip: true
            skip_reason: "No aarch64-darwin runner configured. Pin exists (omp-darwin-arm64). Not a pretend green build."
            build_bezel_pin: false
          - system: x86_64-darwin
            os: ubuntu-latest
            skip: true
            skip_reason: "No x86_64-darwin runner configured. Pin exists (omp-darwin-x64). Not a pretend green build."
            build_bezel_pin: false

    steps:
      - name: Honesty skip
        if: ${{ matrix.skip }}
        run: |
          echo "::notice title=CI honesty skip::${{ matrix.system }} — ${{ matrix.skip_reason }}"
          echo "SKIP ${{ matrix.system }}: ${{ matrix.skip_reason }}"

      - uses: actions/checkout@v4
        if: ${{ !matrix.skip }}

      - uses: DeterminateSystems/nix-installer-action@v16
        if: ${{ !matrix.skip }}

      - name: Secrets must not be baked
        if: ${{ !matrix.skip }}
        run: |
          if git grep -nE '(TYPESAFE_API_KEY|CURSOR_API_KEY|OPENAI_API_KEY)[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"']+' -- ':!.github/workflows/ci.yml'; then
            echo "secret-looking assignment in tree" >&2
            exit 1
          fi
          # Comments that say "never --set TYPESAFE_API_KEY" are the policy, not a bake.
          hits="$(git grep -nE -- '--set(=|[[:space:]])TYPESAFE_API_KEY|builtins.getEnv[[:space:]]*"TYPESAFE_API_KEY"' | grep -vE ':[0-9]+:[[:space:]]*#' || true)"
          if [ -n "$hits" ]; then
            echo "$hits" >&2
            echo "flake must not bake TYPESAFE_API_KEY" >&2
            exit 1
          fi
          echo "secrets scan clean"

      - name: Splash is removed
        if: ${{ !matrix.skip }}
        run: |
          if [ -e assets/omapi-mark.png ] || [ -e assets/bezel-mark.png ] || [ -d assets ]; then
            echo "splash asset must be deleted, not gated" >&2
            exit 1
          fi
          # Product rename does not reopen a banner. Old mark and any Bezel mark stay banned.
          if git grep -n -E 'omapi-mark|bezel-mark|oma on|OMAPI_SPLASH|BEZEL_SPLASH|isatty|isTTY' -- ':!.github/workflows/ci.yml' ':!flake.nix'; then
            echo "splash must be removed, not gated behind a TTY check" >&2
            exit 1
          fi
          echo "splash removed"

      - name: Evaluate all four systems (no omp pin fetch)
        if: ${{ !matrix.skip }}
        run: |
          for sys in aarch64-darwin x86_64-darwin aarch64-linux x86_64-linux; do
            echo "== eval packages.$sys =="
            test "$(nix eval --raw ".#packages.$sys.bezel.pname")" = bezel
            test "$(nix eval --raw ".#packages.$sys.omapi.pname")" = bezel
            test "$(nix eval --raw ".#packages.$sys.bezel-jev.pname")" = bezel-jev
            test "$(nix eval --raw ".#packages.$sys.jev-router.pname")" = bezel-jev
            test "$(nix eval --raw ".#packages.$sys.cursor-agent-bezel.name")" = cursor-agent-bezel
            test "$(nix eval --raw ".#packages.$sys.grok-build-bezel.name")" = grok-build-bezel
            nix eval --json ".#packages.$sys.omp-pin.meta.platforms"
          done

      - name: flake check (host packages; not bezel-pinned)
        if: ${{ !matrix.skip }}
        run: nix flake check -L

      - name: build overlay packages (skip 180–240MB pin)
        if: ${{ !matrix.skip }}
        run: |
          nix build -L .#bezel .#bezel-jev .#cursor-agent-bezel .#grok-build-bezel
          test -x result/bin/bezel
          test -x result/bin/omapi
          test -x result-2/bin/bezel-jev
          test -x result-2/bin/jev-router
          test -x result-3/bin/cursor-agent-bezel
          test -x result-4/bin/grok-build-bezel
          echo "bezel-pinned fetchurl skipped on GHA (build_bezel_pin=${{ matrix.build_bezel_pin }}; 180–240MB). Pin hashes are in packages/omp-pin.nix."

      - name: build bezel-pinned
        if: ${{ !matrix.skip && matrix.build_bezel_pin }}
        run: nix build -L .#bezel-pinned
